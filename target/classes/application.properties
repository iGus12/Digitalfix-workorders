server.port=8082
spring.application.name=ms-digitalfix-workorders

# Conexión a Oracle (la misma que usa el catálogo)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=SYSTEM
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# --- CONFIGURACION RABBITMQ ---
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin123

# NOMBRES CENTRALIZADOS
rabbitmq.exchange.main=digitalfix.exchange
rabbitmq.exchange.dlx=digitalfix.dlx
rabbitmq.queue.workorders=workorders.queue
rabbitmq.routing.workorders=workorders.routing.key
rabbitmq.queue.dlq=workorders.dlq
rabbitmq.routing.dlq=workorders.dlq.routing.key

# Activar confirmación manual (Requisito de la pauta)
spring.rabbitmq.listener.simple.acknowledge-mode=manual