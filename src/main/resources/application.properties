server.port=8082
spring.application.name=ms-digitalfix-workorders

# Conexión a Oracle (la misma que usa el catálogo)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=SYSTEM
spring.datasource.password=oracle
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# --- CONFIGURACION RABBITMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# NOMBRES CENTRALIZADOS
rabbitmq.exchange.main=digitalfix.exchange
rabbitmq.exchange.dlx=digitalfix.dlx
rabbitmq.queue.workorders=workorders.queue
rabbitmq.routing.workorders=workorders.routing.key
rabbitmq.queue.dlq=workorders.dlq
rabbitmq.routing.dlq=workorders.dlq.routing.key

# Activar confirmación manual (Requisito de la pauta)
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Integracion con MS Notificaciones
rabbitmq.notificaciones.exchange=cmd.direct
rabbitmq.notificaciones.routing.gmail=email.send
rabbitmq.notificaciones.routing.interna=notificacion.interna

# Microsoft Entra ID - Validacion de JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/cc0041c5-4918-4ed1-9a20-23dc386471d4/v2.0

